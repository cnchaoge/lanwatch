[package]
name = "lanwatch"
version = "0.1.0"
description = "从这台电脑看出网断在哪一段"
edition = "2021"

[lib]
name = "lanwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
